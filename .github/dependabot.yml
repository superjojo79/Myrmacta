version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Décision n° 103. Liquibase >= 5.0.0 est sous FSL-1.1-ALv2 (la 5.0.0 a un POM
    # qui dit Apache-2.0, mais le LICENSE.txt du tag est un contrat de souscription).
    # Le pom épingle 4.33.0, dernière version Apache-2.0 vérifiée (texte et POM).
    ignore:
      - dependency-name: "org.liquibase:*"
        versions:
          - ">= 5.0.0"
      # Décision n° 91. Le PostgreSQL embarqué des tests reste aligné sur la version de
      # docker-compose.yml et de la production (17). La montée en 18 se fait avec celle de
      # la base de production, dans une PR dédiée ; les mises à jour 17.x restent proposées.
      - dependency-name: "io.zonky.test.postgres:embedded-postgres-binaries-bom"
        versions:
          - ">= 18"
