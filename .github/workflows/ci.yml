name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # TODO §95 : cohérence de la documentation (liens, copies de skills, références TODO §N et identifiants de
  # décision cités par le code, versions du README). Hors ligne, quelques secondes.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test of the documentation checks
        run: scripts/check-docs.sh --self-test

      - name: Documentation checks
        run: scripts/check-docs.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and verify (tests, ArchUnit, Jacoco)
        run: ./mvnw -B verify

      # Le jar de production ne doit embarquer ni zonky ni PostgreSQL embarqué (profil démo/QA).
      - name: Check production jar has no embedded database
        run: scripts/check-no-embedded-db-in-jar.sh

      # Décision n° 103 : LICENSE (PolyForm-Noncommercial-1.0.0) et NOTICE accompagnent le jar.
      - name: Check production jar ships LICENSE and NOTICE
        run: |
          scripts/check-license-notice-in-jar.sh --self-test
          scripts/check-license-notice-in-jar.sh

      # Profil démo/QA : persistance de la base embarquée (arrêt/redémarrage de l'application).
      - name: Embedded database profile tests (demo/QA)
        run: >
          ./mvnw -B test -Pembedded-db -Dskip.frontend=true -Djacoco.skip=true
          -Dtest='ZonkyEmbeddedDbLauncherTest,EmbeddedDbProfileRestartIT'
          -Dsurefire.failIfNoSpecifiedTests=false

      # TODO §72 : parcours réel de bout en bout (navigateur + Spring Boot sur PostgreSQL embarqué, sans API simulée).
      # Réutilise le portail construit par l'étape précédente (target/classes/static/portal).
      - name: Install Playwright browsers (signature E2E)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Signature end-to-end (browser + real backend)
        run: >
          ./mvnw -B test -Dtest=SignatureBrowserE2eTest -Dsignature.e2e=true
          -Dskip.frontend=true -Djacoco.skip=true -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Keep E2E as a separate step for clearer CI logs; locally agents should
      # use `npm run test:all` (Vitest + Playwright) before claiming Phase 8/9 FE.
      - name: E2E tests (Playwright)
        run: npm run test:e2e
