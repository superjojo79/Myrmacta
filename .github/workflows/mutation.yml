name: Mutation

# TODO §108 : tests de mutation, hors `verify` et hors `npm run test:all`.
# - Backend : PIT (profil Maven `mutation`). Frontend : StrykerJS (`npm run test:mutation`, frontend/stryker.config.mjs).
# - Chaque semaine et à la demande : tout le périmètre, seuil bloquant (pit.mutationThreshold du pom, thresholds.break
#   de la configuration Stryker).
# - Sur une PR : seulement les classes ou fichiers du périmètre modifiés (ou dont le test l'est).
#   PIT : même seuil bloquant que le run complet (pit.mutationThreshold du pom). Stryker : sans seuil, informatif.
# Rapport HTML en artefact, mutants non tués dans le résumé du job.

on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/main/java/**"
      - "src/test/java/**"
      - "pom.xml"
      - "frontend/src/**"
      - "frontend/portal/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/stryker.config.mjs"
      - "frontend/vite.config.ts"
      - ".github/workflows/mutation.yml"
      - "scripts/mutation-*"

permissions:
  contents: read

# TODO §110 : la variable de dépôt `CI_RUNNER` envoie les jobs sur le runner auto-hébergé (docker/ci-runner) ;
# sans elle, ubuntu-latest.

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changed-classes:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classes to mutate
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          scripts/mutation-targets.sh --self-test
          targets="$(scripts/mutation-targets.sh "origin/$BASE_REF")"
          echo "classes=$targets" >> "$GITHUB_OUTPUT"
          if [[ -z "$targets" ]]; then
            echo "Aucune classe du périmètre de mutation modifiée : rien à muter." >> "$GITHUB_STEP_SUMMARY"
          else
            tr ',' '\n' <<< "$targets"
          fi

      - name: Set up JDK 25
        if: steps.targets.outputs.classes != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Mutation testing (changed classes, threshold enforced)
        if: steps.targets.outputs.classes != ''
        env:
          TARGETS: ${{ steps.targets.outputs.classes }}
        run: >
          ./mvnw -B -Pmutation test-compile pitest:mutationCoverage
          "-Dpit.targetClasses=$TARGETS"

      - name: Summary
        if: always() && steps.targets.outputs.classes != ''
        run: scripts/mutation-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.targets.outputs.classes != ''
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: ignore

  full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Mutation testing (full scope, threshold enforced)
        run: ./mvnw -B -Pmutation test-compile pitest:mutationCoverage

      - name: Summary
        if: always()
        run: scripts/mutation-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: ignore

  frontend-changed-files:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Files to mutate
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          scripts/mutation-targets-frontend.sh --self-test
          targets="$(scripts/mutation-targets-frontend.sh "origin/$BASE_REF")"
          echo "files=$targets" >> "$GITHUB_OUTPUT"
          # Outillage modifié sans fichier à muter : le run initial (sans mutation) vérifie au moins la configuration.
          tooling="$(git diff --name-only "origin/$BASE_REF"...HEAD -- frontend/stryker.config.mjs frontend/vite.config.ts \
            frontend/package.json frontend/package-lock.json scripts/mutation-targets-frontend.sh)"
          if [[ -z "$targets" && -n "$tooling" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Outillage de mutation modifié sans fichier à muter : run initial seul (--dryRunOnly)." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$targets" ]]; then
            echo "Aucun fichier frontend du périmètre de mutation modifié : rien à muter." >> "$GITHUB_STEP_SUMMARY"
          else
            tr ',' '\n' <<< "$targets"
          fi

      - name: Set up Node.js
        if: steps.targets.outputs.files != '' || steps.targets.outputs.dry_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.targets.outputs.files != '' || steps.targets.outputs.dry_run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Mutation testing (changed files, report only)
        if: steps.targets.outputs.files != ''
        working-directory: frontend
        env:
          TARGETS: ${{ steps.targets.outputs.files }}
          STRYKER_NO_BREAK: "1"
        run: npx --no-install stryker run --ignoreStatic --mutate "$TARGETS"

      - name: Stryker dry run (tooling changed, nothing to mutate)
        if: steps.targets.outputs.dry_run == 'true'
        working-directory: frontend
        run: npx --no-install stryker run --dryRunOnly

      - name: Summary
        if: always() && steps.targets.outputs.files != ''
        run: scripts/mutation-summary.py frontend/reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.targets.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: frontend/reports/mutation/
          if-no-files-found: ignore

  frontend-full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Mutation testing (full scope, threshold enforced)
        working-directory: frontend
        run: npm run test:mutation

      - name: Summary
        if: always()
        run: scripts/mutation-summary.py frontend/reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: frontend/reports/mutation/
          if-no-files-found: ignore
