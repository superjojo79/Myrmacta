# git-cliff — génère les sections du CHANGELOG à partir de l'historique de main (TODO §95, D-REMED-CHANGELOG).
# Une entrée par pull request : le titre de la PR (2ᵉ ligne d'un commit « Merge pull request #N ») ou le
# sujet d'un commit squash terminé par « (#N) ». Les commits de branche, sans numéro de PR, sont ignorés.
# Usage : scripts/changelog-release.sh <version> [<plage git>] (voir l'en-tête de CHANGELOG.md).

[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
{% set_global has_pr = false %}{% for commit in commits %}{% if commit.links %}{% set_global has_pr = true %}{% endif %}{% endfor %}\
{% if has_pr %}
### {{ group | striptags | trim }}

{% for commit in commits %}{% if commit.links %}\
- **{% for link in commit.links %}[{{ link.text }}]({{ link.href }}){% endfor %}** — \
{{ commit.message | split(pat="\n") | first | split(pat=" (#") | first | upper_first | trim }}
{% endif %}{% endfor %}\
{% endif %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
commit_preprocessors = [
  # « Merge pull request #181 from owner/branche » + ligne vide + titre de la PR -> « titre (#181) »
  { pattern = '^Merge pull request #(\d+) from \S+\n\n([^\n]+)', replace = "${2} (#${1})" },
]
link_parsers = [
  { pattern = '\(#(\d+)\)$', href = "https://github.com/superjojo79/Myrmacta/pull/$1", text = "PR #$1" },
]
commit_parsers = [
  { message = '^Merge ', skip = true },
  { field = "scope", pattern = "^(security|securite|sécurité)$", group = "<!-- 3 -->Sécurité" },
  { message = '^feat', group = "<!-- 0 -->Ajouté" },
  { message = '^fix', group = "<!-- 2 -->Corrigé" },
  { message = '^docs', group = "<!-- 4 -->Documentation" },
  { message = '^build\(deps\)', group = "<!-- 5 -->Dépendances" },
  { message = '.*', group = "<!-- 1 -->Modifié" },
]
