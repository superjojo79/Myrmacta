# Infrastructure locale minimale pour Myrmacta : PostgreSQL + Keycloak (toujours démarrés)
# et un backend de stockage objet compatible S3, au choix via profil Compose.
#
# Compatible `docker compose` et `podman compose` (ou `podman-compose`) sans modification —
# voir docs/guides/GETTING-STARTED.md pour le choix du runtime conteneur selon l'OS.
#
# Démarrage minimal (stockage filesystem, aucun conteneur objet requis) :
#   docker compose up -d
#
# Avec stockage S3-compatible (un seul profil à la fois) :
#   docker compose --profile minio     up -d
#   docker compose --profile rustfs    up -d
#   docker compose --profile seaweedfs up -d
#
# Avec Prometheus (scrape local du endpoint /actuator/prometheus du backend) :
#   docker compose --profile prometheus up -d
#
# Avec Kafka (pour tester/démontrer le connecteur `kafka`, connecteurs-cible lot B1) :
#   docker compose --profile kafka up -d
#
# Avec ClamAV (pour activer le scan antivirus réel des pièces jointes, lot C — voir
# docs/guides/DEPLOIEMENT.md § ClamAV ; nécessite aussi APP_DOSSIER_ATTACHMENT_SCAN_TYPE=clamav) :
#   docker compose --profile clamav up -d
#
# Avec Mailpit (SMTP de capture local : reçoit les e-mails sans les délivrer, UI web sur :8025 ;
# nécessite MAIL_PORT=1025 dans .env — voir docs/guides/GETTING-STARTED.md §6) :
#   docker compose --profile mailpit up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-myrmacta}
      POSTGRES_USER: ${POSTGRES_USER:-myrmacta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-myrmacta}}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myrmacta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    # TODO §104 — même port dans le conteneur et sur l'hôte : le realm myrmacta appelle le simulateur FAS
    # (fas-simulateur-realm.json) par http://localhost:<port>, l'adresse que voit aussi le navigateur.
    command: start-dev --import-realm --http-port=${KEYCLOAK_PORT:-8081}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8081}
      MYRMACTA_BASE_URL: ${MYRMACTA_BASE_URL:-${FLOWFORGE_BASE_URL:-http://localhost:8080}} # flowforge-legacy
      MYRMACTA_PORTAL_JWKS_URL: ${MYRMACTA_PORTAL_JWKS_URL:-${FLOWFORGE_PORTAL_JWKS_URL:-http://host.docker.internal:8080/api/portal/identity/jwks}} # flowforge-legacy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KEYCLOAK_PORT:-8081}:${KEYCLOAK_PORT:-8081}"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro

  # --- Stockage objet compatible S3 — un seul backend à la fois, activé par profil ---

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-myrmacta}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-myrmacta123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-myrmacta}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-myrmacta123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-myrmacta-documents}
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\"; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET_NAME
      "

  rustfs:
    image: rustfs/rustfs:latest
    profiles: ["rustfs"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-myrmacta}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-myrmacta123}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data/rustfs0
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: minio/mc:latest
    profiles: ["rustfs"]
    depends_on: [rustfs]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-myrmacta}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-myrmacta123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-myrmacta-documents}
    entrypoint: >
      sh -c "
      until mc alias set local http://rustfs:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\"; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET_NAME
      "

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    profiles: ["seaweedfs"]
    # `server -s3` démarre master + volume + filer + s3 dans un seul processus — suffisant
    # pour du dev local. Seul le port S3 (8333) doit être publié vers l'hôte.
    command: server -dir=/data -s3 -ip.bind=0.0.0.0
    ports:
      - "8333:8333"   # API S3
    volumes:
      - seaweedfs_data:/data

  seaweedfs-init:
    image: minio/mc:latest
    profiles: ["seaweedfs"]
    depends_on: [seaweedfs]
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-myrmacta-documents}
    # SeaweedFS n'a pas de notion de clé d'accès par défaut en mode dev local (auth désactivée) —
    # `mc alias set` accepte des identifiants factices tant que le serveur n'exige pas d'IAM.
    entrypoint: >
      sh -c "
      until mc alias set local http://seaweedfs:8333 any any; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET_NAME
      "

  # --- Événementiel — connecteur `kafka` (connecteurs-cible, lot B1), dev/démo local ---

  kafka:
    # Image officielle Apache Kafka, mode KRaft natif (D-KAFKA-COMPOSE, requirements) — pas de
    # Zookeeper, un seul processus broker+controller suffisant pour du dev local.
    image: apache/kafka:3.8.0
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Identifiant de cluster fixe (dev/démo uniquement) — évite de le régénérer à chaque
      # `docker compose up`, ce que ferait un volume anonyme sans CLUSTER_ID explicite.
      CLUSTER_ID: NmZmMWQyZjItZjA1Mi00
    ports:
      - "${KAFKA_PORT:-9094}:9094"   # PLAINTEXT_HOST, joignable depuis l'hôte
    volumes:
      - kafka_data:/var/lib/kafka/data

  # --- Antivirus — scan réel des pièces jointes (lot C, D-AV-CLAMAV-TOPO : service mutualisé,
  # pas un sidecar par tenant), dev/démo local uniquement (D-AV-CLAMAV-PROD-TOPO : en prod,
  # clamd est un service externe déjà provisionné, même modèle que PostgreSQL/Keycloak) ---

  clamav:
    # Image officielle Cisco Talos, tag épingle (D-AV-CLAMAV-IMAGE) — pas `latest`, cohérent
    # avec postgres/keycloak/kafka ci-dessus. Chemin de montage clamd.conf non vérifié contre un
    # conteneur réel dans ce cycle (démon Docker absent du bac à sable) — voir
    # docker/clamav/clamd.conf pour le détail de cette limite assumée.
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    volumes:
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav_data:/var/lib/clamav
    ports:
      # Publié sur toutes les interfaces par défaut, sans authentification — le protocole clamd
      # expose aussi SHUTDOWN (non authentifié, arrête clamd) au-delà d'INSTREAM. Acceptable en
      # dev/démo local (même exposition que postgres/keycloak ci-dessus), mais ne jamais publier
      # ce port au-delà du loopback/réseau de confiance hors de ce contexte — trouvé en revue
      # adversariale, en prod clamd est de toute façon un service externe séparé (D-AV-CLAMAV-
      # PROD-TOPO, docs/guides/DEPLOIEMENT.md § ClamAV), pas ce profil Compose.
      - "${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      # Trouvé en Phase 7 (check implementation) : un premier essai basé sur la redirection
      # /dev/tcp de bash supposait bash présent dans l'image — pas vérifiable dans ce bac à
      # sable (Docker absent). `test -f` (POSIX sh, aucune dépendance externe) sur le PidFile
      # déclaré dans docker/clamav/clamd.conf est plus portable et ne dépend que de ce que clamd
      # écrit lui-même à son démarrage réel — mais reste sujet à la même limite documentée
      # ailleurs (chemin de montage clamd.conf non vérifié contre un conteneur réel).
      test: ["CMD-SHELL", "test -f /run/clamav/clamd.pid"]
      # Chargement initial des définitions virales par freshclam avant que clamd n'accepte des
      # connexions — plus long qu'un healthcheck applicatif classique (D-AV-CLAMAV-FRESHCLAM :
      # mécanisme natif de l'image, pas de job séparé).
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 5m

  # --- E-mail — SMTP de capture pour le canal email (dev/démo local uniquement) ---

  mailpit:
    # Capture tous les e-mails sans les délivrer (invitations de signature, liens du portail,
    # notifications), consultables sur http://localhost:8025. SMTP sans auth ni TLS sur le port
    # 1025 de l'hôte (pas 587 : Docker/Podman rootless refusent les ports < 1024) — positionner
    # MAIL_PORT=1025 dans .env ; l'indicateur de santé mail du backend passe alors UP. Jamais en
    # production : relais SMTP réel (docs/guides/GETTING-STARTED.md §6, docs/guides/DEPLOIEMENT.md).
    image: axllent/mailpit:v1.31.5
    profiles: ["mailpit", "video"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
      - "8025:8025"                         # UI web

  greenmail:
    # Boîte e-mail de la capsule vidéo (TODO §128, D-VIDEO-MAIL) : le tournage envoie la facture et la réponse du
    # fournisseur en SMTP (3025) à courrier@demo.example, que le connecteur IMAP de la démo relève (3143, sans chiffrement,
    # permis seulement vers la boucle locale en profil local : D-IMAP-LOCAL-LOOPBACK). Même version que la bibliothèque
    # de test. Jamais en production. `scripts/video.sh scene` le démarre avec Mailpit.
    image: greenmail/standalone:2.1.15
    profiles: ["video"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=courrier:demo@demo.example -Dgreenmail.users.login=local_part -Dgreenmail.verbose
    ports:
      - "127.0.0.1:3025:3025"   # SMTP (envoi du tournage)
      - "127.0.0.1:3143:3143"   # IMAP (relève par Myrmacta)

  # --- Observabilité — scrape local de /actuator/prometheus, exposé par le backend ---

  prometheus:
    image: prom/prometheus:latest
    profiles: ["prometheus"]
    # Le backend tourne sur l'hôte (pas en conteneur, voir docs/guides/GETTING-STARTED.md §7) et son port
    # management est bindé en loopback (127.0.0.1:8090 par défaut, D-42, application.yml) —
    # `permitAll` n'y est acceptable QUE parce qu'il n'est joignable que depuis la machine
    # elle-même. `network_mode: host` fait partager à ce conteneur l'espace réseau de l'hôte :
    # il atteint donc 127.0.0.1:8090 directement, sans exposer ce port au-delà du loopback ni
    # affaiblir D-42. Fonctionne tel quel sous Linux (Docker Engine ou Podman rootless). Sous
    # macOS/Windows Docker Desktop, `network_mode: host` exige d'activer "Host networking"
    # (Docker Desktop ≥ 4.34, désactivé par défaut) — à défaut, interroger l'endpoint
    # directement (`curl http://127.0.0.1:8090/actuator/prometheus`) sans ce conteneur.
    network_mode: host
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:9090

volumes:
  pg_data:
  keycloak_data:
  minio_data:
  rustfs_data:
  seaweedfs_data:
  prometheus_data:
  kafka_data:
  clamav_data:
