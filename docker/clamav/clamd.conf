# clamd.conf minimal pour le profil docker-compose `clamav` (local/démo uniquement,
# D-AV-CLAMAV-PROD-TOPO — pas le mécanisme de déploiement prod).
#
# Directives clamd standard (stables depuis longtemps, indépendantes de l'image Docker) :
# https://man.archlinux.org/man/clamd.conf.5 pour référence si besoin de les retrouver.
#
# NON VÉRIFIÉ CONTRE UN CONTENEUR RÉEL dans ce cycle : ni `docker pull`/`docker run`
# (démon Docker absent du bac à sable de développement), ni la doc officielle (domaines
# docs.clamav.net / hub.docker.com bloqués par la politique réseau de la session) n'étaient
# accessibles. Le chemin de montage (/etc/clamav/clamd.conf) suit la convention de paquetage
# ClamAV standard (Debian et dérivés) — à confirmer/ajuster au premier `docker compose
# --profile clamav up` réel (cf. limite similaire assumée et documentée pour le Dockerfile du
# lot A1, docs/ai/implementation/2026-09-08-feature-provisioning-tenant.md).

TCPSocket 3310
TCPAddr 0.0.0.0

# D-AV-CLAMAV-SIZE-ALIGN : alignée sur spring.servlet.multipart.max-file-size
# (APP_DOSSIER_ATTACHMENT_MAX_SIZE_MB, défaut 25 Mo, application.yml). Si l'un des deux est
# relevé, relever l'autre en conséquence — sinon un fichier légitime dans la plage haute
# franchit clamd en fail-open (D-AV-CLAMAV-FAILMODE) sans être réellement scanné.
StreamMaxLength 25M

LogFile /dev/stdout
LogTime yes
PidFile /run/clamav/clamd.pid
