<!doctype html>
<!--
  TODO §128 (D-VIDEO-PIPELINE, issue #56) — carton plein écran des capsules : titre de capsule, transition (« 25 jours plus
  tard ») ou fin. Page statique, ouverte par le tournage : card.html?kicker=…&title=…&subtitle=…  Aucun appel réseau.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myrmacta</title>
  <style>
    :root { --bg1: #0d1b2a; --bg2: #1b263b; --accent: #4cc9f0; --text: #f1f5f9; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; color: var(--text);
           background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 70%);
           font: 400 20px/1.4 "Segoe UI", "Inter", system-ui, sans-serif; }
    .card { text-align: center; max-width: 80vw; animation: in .9s ease-out both; }
    .kicker { color: var(--accent); letter-spacing: .25em; text-transform: uppercase; font-size: 22px; font-weight: 600; }
    h1 { font-size: 72px; line-height: 1.1; margin: 18px 0 14px; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 30px; }
    .brand { position: fixed; bottom: 36px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 22px;
             letter-spacing: .08em; }
    .brand b { color: var(--text); }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="brand"><b>Myrmacta</b> · myrmacta.be</div>
  <script>
    const params = new URLSearchParams(location.search);
    for (const key of ['kicker', 'title', 'subtitle']) {
      document.getElementById(key).textContent = params.get(key) || '';
    }
    document.documentElement.lang = params.get('lang') === 'en' ? 'en' : 'fr';
  </script>
</body>
</html>
