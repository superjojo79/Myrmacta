<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- DD-BASE : réécrite par le backend en <base href="{context-path}/"> (SpaFallbackConfig) ; les
         assets relatifs (base: './'), le routeur et le préfixe API se résolvent contre elle, jamais
         contre la route courante. -->
    <base href="/" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E2A3A" />
    <title>Myrmacta</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
