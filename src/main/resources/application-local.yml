# Profil local : secrets de démo et HMAC M2M autorisés (D-43).
# Activer avec --spring.profiles.active=local ou SPRING_PROFILES_ACTIVE=local
# (voir docs/guides/GETTING-STARTED.md). Hors local/test, SecretsEnvironmentPostProcessor
# refuse les mots de passe denylist et le HMAC M2M.
spring:
  config:
    activate:
      on-profile: local
server:
  # Neutralise le context-path multi-tenant (application.yml) pour ce profil : le poste de
  # dev continue de servir l'application à la racine "/" (lot provisioning-tenant).
  servlet:
    context-path: ""
app:
  security:
    cookie:
      secure: false
