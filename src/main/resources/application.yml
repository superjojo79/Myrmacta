# Flowable V1 = moteur BPMN + DMN (TODO §61, introduction-dmn). Auto-config exclue : JPA,
# Security, App Engine, IDM, Event Registry, CMMN, REST API, actuator Flowable, LDAP
# (voir spring.autoconfigure.exclude). Les exclusions Spring Security / OAuth2
# Client ont été retirées (feature authentification). DMN activé (TODO §61) : businessRuleTask
# reste rejeté (câblé sur Drools, hors sujet) -- l'invocation DMN passe par
# serviceTask flowable:type="dmn", validé par FlowableDmnParserAdapter (allowlist JUEL, même
# moteur que les gateways BPMN) avant d'être autorisé au parsing BPMN.
spring:
  application:
    name: flowforge
  thymeleaf:
    check-template-location: false
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.FlowableJpaAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineServicesAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineServicesAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.RestApiAutoConfiguration
      - org.flowable.spring.boot.EndpointAutoConfiguration
      - org.flowable.spring.boot.actuate.info.FlowableInfoAutoConfiguration
      - org.flowable.spring.boot.ldap.FlowableLdapAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge_tenant_dev}
    password: ${DB_PASSWORD:flowforge}
    hikari:
      connection-init-sql: SET search_path TO ${app.tenant.id}, public
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: ${APP_DOSSIER_ATTACHMENT_MAX_SIZE_MB:25}MB
      max-request-size: ${APP_DOSSIER_ATTACHMENT_MAX_SIZE_MB:25}MB
      # Defers multipart parsing until the controller reads the file parameter, so a
      # MaxUploadSizeExceededException is thrown from inside DossierElementUploadController
      # instead of during dispatch (handler not yet resolved) — required for the
      # basePackage-scoped DossierExceptionHandler @ExceptionHandler to catch it (design T7/T9).
      resolve-lazily: true
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID:mon-app}
            client-secret: ${OIDC_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            provider: oidc
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI}
  ai:
    # Serveur MCP M2M (serveur-mcp, D-TRANSPORT/D-ENDPOINT=A) — outillage interne
    # (API_SERVICE) sous la chaîne Security /api/m2m/** existante. Pas de starter
    # chat/model : capabilities.tool seul, annotation-scanner détecte les @McpTool.
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: flowforge
        version: 0.1.0
        type: SYNC
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /api/m2m/mcp

management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

server:
  forward-headers-strategy: framework
  servlet:
    # Routage multi-tenant par chemin (décision n°14) — actif par défaut pour toute
    # instance déployée (surchargé à vide en profil local, cf. application-local.yml, pour
    # que le poste de dev continue de servir l'application à la racine "/", comme
    # documenté dans GETTING-STARTED.md). À faire correspondre au bloc reverse-proxy
    # statique du tenant (DEPLOIEMENT.md §3).
    context-path: /${app.tenant.id}
    session:
      cookie:
        same-site: lax
        secure: ${app.security.cookie.secure:true}

app:
  tenant:
    id: tenant_dev   # unique par instance déployée — jamais résolu dynamiquement
  security:
    cookie:
      secure: true   # false en local HTTP (profil / override)
    headers:
      enabled: ${APP_SECURITY_HEADERS_ENABLED:true}
    m2m:
      issuer-uri: ${OAUTH2_ISSUER_URI:}   # resource-server JWT M2M ; vide en local/test
      jwt-secret: ${M2M_JWT_SECRET:}       # HMAC HS256 optionnel (local/test sans IdP)
      # allowlist optionnelle des client_id/sub JWT M2M autorisés au rôle API_SERVICE
      # (McpAccessContextFactory). Vide (défaut) = tout JWT M2M authentifié reçoit API_SERVICE
      # (comportement historique, un seul client M2M de confiance). À renseigner avant d'accorder
      # l'accès /api/m2m/mcp à un second client M2M (revue adversariale A3-M2, TODO §56).
      trusted-client-ids: ${M2M_TRUSTED_CLIENT_IDS:}
  workflow:
    reserve-timeout: 5m
    outbox:
      batch-size: 20
      max-attempts: 5
      poll-delay: 1s
      processed-retention: 7d
    idempotency-retention: 7d
    retention:
      poll-delay: 1d
    bpmn-upload:
      # Taille max : pas de borne dédiée ici, la seule limite est
      # spring.servlet.multipart.max-file-size/max-request-size ci-dessus — une seule source de
      # vérité, pas de second seuil applicatif à garder synchronisé (même convention que
      # app.dossier.attachment).
      allowed-content-types: ${APP_WORKFLOW_BPMN_UPLOAD_ALLOWED_TYPES:application/xml,text/xml}
  connector:
    crypto:
      master-key: ${APP_CONNECTOR_MASTER_KEY:}
    webhook:
      max-body-bytes: 1048576
      rate-limit-per-minute: 120
      idempotency-ttl: 24h
    http:
      connect-timeout: 5s
      request-timeout: 5s
      max-response-bytes: 5242880
  document:
    generate:
      max-body-bytes: 262144
      rate-limit-per-minute: 30
    preview:
      rate-limit-per-minute: 120
  notification:
    outbox:
      batch-size: 20
      max-attempts: 3
      poll-delay: 1s
      retention: 7d
    webhook:
      connect-timeout: 5s
      read-timeout: 5s
    sse:
      heartbeat-interval: 15s
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
    filesystem:
      root: ${APP_STORAGE_FS_ROOT:./data/documents}
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${APP_STORAGE_S3_REGION:us-east-1}
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      access-key-id: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-access-key: ${APP_STORAGE_S3_SECRET_KEY:}
  retention:
    poll-delay: 1h
    batch-size: 100
  purge:
    poll-delay: 1h
    batch-size: 50
    processing-timeout: 2h
  openapi:
    enabled: false
  dossier:
    attachment:
      # Taille max : app.storage n'a pas de borne dédiée, la seule limite est
      # spring.servlet.multipart.max-file-size/max-request-size ci-dessus — une seule source de
      # vérité, pas de second seuil applicatif à garder synchronisé.
      allowed-content-types: ${APP_DOSSIER_ATTACHMENT_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain}

flowable:
  async-executor-activate: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
