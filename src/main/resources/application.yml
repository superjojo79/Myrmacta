# Temporary — disable infra autoconfig until real adapters land (design phase 3).
# Remove entries feature-by-feature (JPA, Security, Flowable, …).
# Security / OAuth2 client exclusions removed — feature authentification (TODO 32 partiel).
spring:
  application:
    name: flowforge
  thymeleaf:
    check-template-location: false
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.FlowableJpaAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineServicesAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineServicesAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineServicesAutoConfiguration
      - org.flowable.spring.boot.RestApiAutoConfiguration
      - org.flowable.spring.boot.EndpointAutoConfiguration
      - org.flowable.spring.boot.actuate.info.FlowableInfoAutoConfiguration
      - org.flowable.spring.boot.ldap.FlowableLdapAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}
    hikari:
      connection-init-sql: SET search_path TO ${app.tenant.id}, public
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID:mon-app}
            client-secret: ${OIDC_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            provider: oidc
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax
        secure: ${app.security.cookie.secure:true}

app:
  tenant:
    id: tenant_dev   # unique par instance déployée — jamais résolu dynamiquement
  security:
    cookie:
      secure: true   # false en local HTTP (profil / override)
    m2m:
      issuer-uri: ${OAUTH2_ISSUER_URI:}   # resource-server JWT M2M ; vide en local/test
      jwt-secret: ${M2M_JWT_SECRET:}       # HMAC HS256 optionnel (local/test sans IdP)
  workflow:
    reserve-timeout: 5m
    outbox:
      batch-size: 20
      max-attempts: 5
      poll-delay: 1s
      processed-retention: 7d
  connector:
    crypto:
      master-key: ${APP_CONNECTOR_MASTER_KEY:}
    webhook:
      max-body-bytes: 1048576
      rate-limit-per-minute: 120
      idempotency-ttl: 24h
  notification:
    outbox:
      batch-size: 20
      max-attempts: 3
      poll-delay: 1s
      retention: 7d
    webhook:
      connect-timeout: 5s
      read-timeout: 5s
    sse:
      heartbeat-interval: 15s
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}
    filesystem:
      root: ${APP_STORAGE_FS_ROOT:./data/documents}
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${APP_STORAGE_S3_REGION:us-east-1}
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      access-key-id: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-access-key: ${APP_STORAGE_S3_SECRET_KEY:}

flowable:
  async-executor-activate: true

