databaseChangeLog:
  - changeSet:
      id: 004-document-template
      author: flowforge
      changes:
        - createTable:
            tableName: document_template
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_document_template
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: template_key
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: variant_key
                  type: varchar(128)
              - column:
                  name: locale
                  type: varchar(32)
              - column:
                  name: label
                  type: varchar(255)
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: html_content
                  type: clob
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(255)
        - createIndex:
            tableName: document_template
            indexName: ix_document_template_tenant_key
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: template_key
        - sqlFile:
            path: sql/004-document-template-unique-indexes-postgresql.sql
            relativeToChangelogFile: true
            dbms: postgresql
            splitStatements: true
