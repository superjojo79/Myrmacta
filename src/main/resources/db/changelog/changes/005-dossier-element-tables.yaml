databaseChangeLog:
  - changeSet:
      id: 005-dossier-element
      author: flowforge
      changes:
        - createTable:
            tableName: dossier_element
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_dossier_element
                    nullable: false
              - column:
                  name: dossier_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: storage_ref
                  type: varchar(512)
              - column:
                  name: metadata
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: added_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: added_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: workflow_step_id
                  type: varchar(128)
        - createIndex:
            tableName: dossier_element
            indexName: ix_dossier_element_tenant_dossier
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: dossier_id
        - createIndex:
            tableName: dossier_element
            indexName: ix_dossier_element_tenant_id
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: id
