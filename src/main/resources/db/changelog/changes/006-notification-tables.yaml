databaseChangeLog:
  - changeSet:
      id: 006-notification-webhook
      author: flowforge
      changes:
        - createTable:
            tableName: notification_webhook
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notification_webhook
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_url
                  type: varchar(2048)
                  constraints:
                    nullable: false
              - column:
                  name: secret_ciphertext
                  type: varchar(2048)
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: notification_webhook
            indexName: ix_notification_webhook_tenant
            columns:
              - column:
                  name: tenant_id
        - sqlFile:
            path: sql/006-notification-webhook-active-index-postgresql.sql
            relativeToChangelogFile: true
            dbms: postgresql
            splitStatements: false
      rollback:
        - sqlFile:
            path: sql/006-notification-webhook-active-index-rollback-postgresql.sql
            relativeToChangelogFile: true
            dbms: postgresql
        - dropTable:
            tableName: notification_webhook

  - changeSet:
      id: 006-notification-outbox
      author: flowforge
      changes:
        - createTable:
            tableName: notification_outbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notification_outbox
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: payload_json
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: varchar(1024)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamp with time zone
        - createIndex:
            tableName: notification_outbox
            indexName: ix_notification_outbox_status_next
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at
      rollback:
        - dropTable:
            tableName: notification_outbox
