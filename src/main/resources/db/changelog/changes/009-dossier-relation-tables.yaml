databaseChangeLog:
  - changeSet:
      id: 009-dossier-relation-tables
      author: flowforge
      changes:
        - createTable:
            tableName: dossier_relation
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_dossier_relation
                    nullable: false
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: source_dossier_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: target_dossier_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: varchar(255)
        - addForeignKeyConstraint:
            constraintName: fk_dossier_relation_source
            baseTableName: dossier_relation
            baseColumnNames: source_dossier_id
            referencedTableName: dossier
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_dossier_relation_target
            baseTableName: dossier_relation
            baseColumnNames: target_dossier_id
            referencedTableName: dossier
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: dossier_relation
            columnNames: tenant_id, source_dossier_id, target_dossier_id, type
            constraintName: uq_dossier_relation
        - addUniqueConstraint:
            tableName: dossier_relation
            columnNames: tenant_id, source_dossier_id, idempotency_key
            constraintName: uq_dossier_relation_idempotency
        - sqlFile:
            path: sql/009-dossier-relation-constraints-indexes.sql
            relativeToChangelogFile: true
            dbms: postgresql
