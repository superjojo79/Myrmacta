databaseChangeLog:
  - changeSet:
      id: 010-tenant-retention-settings
      author: flowforge
      changes:
        - createTable:
            tableName: tenant_retention_settings
            columns:
              - column:
                  name: tenant_id
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tenant_retention_settings
                    nullable: false
              - column:
                  name: default_retention_days
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(128)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: tenant_retention_settings

  - changeSet:
      id: 010-dossier-type-retention-columns
      author: flowforge
      changes:
        - addColumn:
            tableName: dossier_type
            columns:
              - column:
                  name: retention_days
                  type: int
                  constraints:
                    nullable: true
              - column:
                  name: retention_never
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dossier_type
            columnName: retention_days
        - dropColumn:
            tableName: dossier_type
            columnName: retention_never

  - changeSet:
      id: 010-dossier-purge-eligible-at
      author: flowforge
      changes:
        - addColumn:
            tableName: dossier
            columns:
              - column:
                  name: purge_eligible_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: dossier
            columnName: purge_eligible_at

  - changeSet:
      id: 010-dossier-status-closed-at-index
      author: flowforge
      changes:
        - createIndex:
            tableName: dossier
            indexName: idx_dossier_status_closed_at
            columns:
              - column:
                  name: status
              - column:
                  name: closed_at
      rollback:
        - dropIndex:
            tableName: dossier
            indexName: idx_dossier_status_closed_at

  - changeSet:
      id: 010-purge-outbox
      author: flowforge
      changes:
        - createTable:
            tableName: purge_outbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_purge_outbox
                    nullable: false
              - column:
                  name: dossier_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: payload_json
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: purge_outbox
            columnNames: dossier_id
            constraintName: uq_purge_outbox_dossier_id
      rollback:
        - dropTable:
            tableName: purge_outbox
