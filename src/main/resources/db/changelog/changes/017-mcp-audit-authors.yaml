databaseChangeLog:
  - changeSet:
      id: 017-dossier-type-audit-authors
      author: flowforge
      changes:
        - addColumn:
            tableName: dossier_type
            columns:
              - column:
                  name: created_by
                  type: varchar(128)
              - column:
                  name: updated_by
                  type: varchar(128)
        - sqlFile:
            path: sql/017-dossier-type-audit-authors-backfill-created-by.sql
            relativeToChangelogFile: true
        - sqlFile:
            path: sql/017-dossier-type-audit-authors-backfill-updated-by.sql
            relativeToChangelogFile: true
        - addNotNullConstraint:
            tableName: dossier_type
            columnName: created_by
            columnDataType: varchar(128)
        - addNotNullConstraint:
            tableName: dossier_type
            columnName: updated_by
            columnDataType: varchar(128)
      rollback:
        - dropColumn:
            tableName: dossier_type
            columnName: created_by
        - dropColumn:
            tableName: dossier_type
            columnName: updated_by

