databaseChangeLog:
  - changeSet:
      id: 036-connector-stored-object
      author: flowforge
      comment: >-
        D-STORAGE-REF-DOSSIER (issue #205) — objets écrits par le connecteur document-storage, avec le dossier pour lequel
        ils l'ont été (null : appel direct REST ou M2M). Depuis un process, le connecteur ne lit, ne teste ni n'efface que
        les objets enregistrés pour le dossier de l'exécution.
      changes:
        - createTable:
            tableName: connector_stored_object
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_connector_stored_object, nullable: false}}
              - column: {name: tenant_id, type: varchar(64), constraints: {nullable: false}}
              - column: {name: storage_ref, type: varchar(512), constraints: {nullable: false}}
              - column: {name: dossier_id, type: uuid}
              - column: {name: created_at, type: timestamp with time zone, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: connector_stored_object
            columnNames: tenant_id, storage_ref
            constraintName: uq_connector_stored_object_ref
