databaseChangeLog:
  - changeSet:
      id: 037-dossier-unique-value
      author: flowforge
      comment: >-
        TODO §102 (issue #184, D-UNIQUE-STORE) — valeurs des champs « unique » tenues par les dossiers non clôturés.
        La clé primaire garantit qu'une valeur canonique n'appartient qu'à un dossier ouvert du type, y compris sous
        écritures concurrentes. Tenue à jour à chaque enregistrement de dossier et reconstruite à l'enregistrement du
        type ; supprimée avec le dossier (purge).
      changes:
        - createTable:
            tableName: dossier_unique_value
            columns:
              - column: {name: tenant_id, type: varchar(64), constraints: {nullable: false}}
              - column: {name: dossier_type_code, type: varchar(64), constraints: {nullable: false}}
              - column: {name: field_name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: field_value, type: varchar(500), constraints: {nullable: false}}
              - column:
                  name: dossier_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_dossier_unique_value_dossier
                    references: dossier(id)
                    deleteCascade: true
        - addPrimaryKey:
            tableName: dossier_unique_value
            columnNames: tenant_id, dossier_type_code, field_name, field_value
            constraintName: pk_dossier_unique_value
        - createIndex:
            tableName: dossier_unique_value
            indexName: idx_dossier_unique_value_dossier
            columns:
              - column: {name: dossier_id}
