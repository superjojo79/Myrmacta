databaseChangeLog:
  # TODO §105 (issue #211, lot P, D-PIECE-TYPES) — types de pièces justificatives déclarés sur le type de dossier.
  - changeSet:
      id: 039-dossier-type-piece-types
      author: flowforge
      changes:
        - addColumn:
            tableName: dossier_type
            columns:
              - column:
                  name: piece_types
                  type: json
                  constraints:
                    nullable: true
        - update:
            tableName: dossier_type
            columns:
              - column:
                  name: piece_types
                  value: '[]'
        - addNotNullConstraint:
            tableName: dossier_type
            columnName: piece_types
            columnDataType: json
      rollback:
        - dropColumn:
            tableName: dossier_type
            columnName: piece_types
