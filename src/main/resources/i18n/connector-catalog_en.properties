connector.sftp-pdf-inbound.field.sftpHost.label=SFTP host
connector.sftp-pdf-inbound.field.sftpPort.label=SFTP port
connector.sftp-pdf-inbound.field.sftpUsername.label=SFTP username
connector.sftp-pdf-inbound.field.sftpAuthType.label=SFTP auth
connector.sftp-pdf-inbound.field.sftpPassword.label=SFTP password
connector.sftp-pdf-inbound.field.sftpPrivateKey.label=SFTP private key
connector.sftp-pdf-inbound.field.sftpPrivateKey.help=PEM-encoded SSH private key, required when sftpAuthType=PRIVATE_KEY
connector.sftp-pdf-inbound.field.sftpHostKeyFingerprint.label=SFTP host key fingerprint
connector.sftp-pdf-inbound.field.sftpHostKeyFingerprint.help=Expected SSH host key fingerprint (OpenSSH format, e.g. SHA256:...), verified on every connection
connector.sftp-pdf-inbound.field.remoteDirectory.label=Read directory
connector.sftp-pdf-inbound.field.processedDirectory.label=Processed files directory
connector.sftp-pdf-inbound.field.rejectedDirectory.label=Rejected files directory
connector.sftp-pdf-inbound.field.indexFormat.label=Partner index
connector.sftp-pdf-inbound.field.indexFormat.help=JSON: one companion file of the same name per PDF; CSV: one index per batch, one line per PDF; NONE: no index
connector.sftp-pdf-inbound.field.csvPattern.label=CSV index files
connector.sftp-pdf-inbound.field.csvFileColumn.label=File name column (CSV)
connector.sftp-pdf-inbound.field.requireIndex.label=Index required
connector.sftp-pdf-inbound.field.requireIndex.help=True: a PDF without an index waits for its index. False: it is processed immediately, without metadata
connector.sftp-pdf-inbound.field.pollSeconds.label=Interval (seconds)
connector.sftp-pdf-inbound.field.processKey.label=Process key
connector.sftp-pdf-inbound.field.dossierTypeCode.label=Dossier type
connector.sftp-pdf-inbound.field.mapping.label=Mapping
connector.sftp-pdf-inbound.field.mapping.help=JSON object {fields, variables} of paths over {"fichier": name, "index": {…}}, e.g. "$.index.expediteur"
connector.sftp-pdf-inbound.field.defaultFields.label=Default values
connector.sftp-pdf-inbound.field.defaultFields.help=JSON object of constant values, used when the mapping yields nothing, e.g. {"canal": "PAPIER"}
connector.signature.label=Electronic signature (provider callback)
connector.signature.field.webhookAuthType.label=Webhook auth
connector.signature.field.webhookAuthType.help=HMAC_SHA256: X-Webhook-Timestamp + Idempotency-Key + body (X-Signature-256). YOUSIGN_HMAC: raw body (X-Yousign-Signature-256), idempotence = event_id. DOCUSIGN_HMAC: raw body in Base64 (X-DocuSign-Signature-N), idempotence = envelope + event
connector.signature.field.webhookSecret.label=Webhook secret
connector.signature.field.webhookSecret.help=HMAC or shared token secret — at least 20 characters
connector.signature.field.yousignEnvironment.label=Yousign environment
connector.signature.field.yousignEnvironment.help=Fixed call host: sandbox or production. Never a free-form URL.
connector.signature.field.yousignApiKey.label=Yousign API key
connector.signature.field.yousignApiKey.help=API key for the same environment. Required when the active provider is Yousign.
connector.signature.field.docusignEnvironment.label=DocuSign environment
connector.signature.field.docusignEnvironment.help=Fixed OAuth host: sandbox or production. Never a free-form URL.
connector.signature.field.docusignIntegrationKey.label=DocuSign integration key
connector.signature.field.docusignIntegrationKey.help=Integration key (JWT iss). Required when the active provider is DocuSign.
