# Connector catalog labels and help (English default) — D-CONNECTOR-CATALOG-I18N / §141

connector.azure-service-bus.label=Azure Service Bus (queue or subscription, polling)
connector.azure-service-bus.field.namespaceHost.label=Namespace host
connector.azure-service-bus.field.namespaceHost.help=e.g. mybus.servicebus.windows.net (Service Bus domains only).
connector.azure-service-bus.field.entityPath.label=Queue or subscription
connector.azure-service-bus.field.entityPath.help=A queue name, or <topic>/subscriptions/<subscription>.
connector.azure-service-bus.field.authMode.label=Authentication
connector.azure-service-bus.field.authMode.help=SAS = shared access policy with the Listen right. OAUTH2_CLIENT_CREDENTIALS = Entra ID application (role Azure Service Bus Data Receiver, scope https://servicebus.azure.net/.default).
connector.azure-service-bus.field.sasKeyName.label=SAS policy name
connector.azure-service-bus.field.sasKeyName.help=Required with SAS. Give it the Listen right only.
connector.azure-service-bus.field.sasKey.label=SAS policy key
connector.azure-service-bus.field.sasKey.help=Encrypted at rest. Required with SAS.
connector.azure-service-bus.field.pollSeconds.label=Polling interval (seconds)
connector.azure-service-bus.field.processKey.label=Process key
connector.azure-service-bus.field.dossierTypeCode.label=Dossier type
connector.azure-service-bus.field.mapping.label=Message mapping
connector.azure-service-bus.field.mapping.help=JSON object of JSONPath mappings over the JSON message body: fields, variables, processKeyPath, dossierTypeCodePath, existingDossierReferencePath.
connector.azure-service-bus.field.oauthTokenUrl.label=OAuth2 token URL
connector.azure-service-bus.field.oauthTokenUrl.help=https token endpoint, e.g. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Used only when the authentication mode is OAUTH2_CLIENT_CREDENTIALS.
connector.azure-service-bus.field.oauthClientId.label=OAuth2 client id
connector.azure-service-bus.field.oauthClientId.help=Application (client) id.
connector.azure-service-bus.field.oauthClientAuthMethod.label=OAuth2 client authentication
connector.azure-service-bus.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC use oauthClientSecret; PRIVATE_KEY_JWT uses oauthPrivateKey and oauthCertThumbprint.
connector.azure-service-bus.field.oauthClientSecret.label=OAuth2 client secret
connector.azure-service-bus.field.oauthClientSecret.help=Encrypted at rest.
connector.azure-service-bus.field.oauthPrivateKey.label=OAuth2 certificate private key
connector.azure-service-bus.field.oauthPrivateKey.help=PEM PKCS#8 RSA private key. Encrypted at rest. Required for PRIVATE_KEY_JWT.
connector.azure-service-bus.field.oauthCertThumbprint.label=OAuth2 certificate thumbprint
connector.azure-service-bus.field.oauthCertThumbprint.help=Hexadecimal SHA-1 (40) or SHA-256 (64) thumbprint. Required for PRIVATE_KEY_JWT.
connector.azure-service-bus.field.oauthScope.label=OAuth2 scope
connector.azure-service-bus.field.oauthScope.help=e.g. https://outlook.office365.com/.default (mailbox) or https://servicebus.azure.net/.default (Service Bus).
connector.batch-import.label=Batch import (SFTP, CSV/Excel, cron trigger)
connector.batch-import.field.sftpHost.label=SFTP host
connector.batch-import.field.sftpPort.label=SFTP port
connector.batch-import.field.sftpUsername.label=SFTP username
connector.batch-import.field.sftpAuthType.label=SFTP auth
connector.batch-import.field.sftpPassword.label=SFTP password
connector.batch-import.field.sftpPrivateKey.label=SFTP private key
connector.batch-import.field.sftpPrivateKey.help=PEM-encoded SSH private key, required when sftpAuthType=PRIVATE_KEY
connector.batch-import.field.sftpHostKeyFingerprint.label=SFTP host key fingerprint
connector.batch-import.field.sftpHostKeyFingerprint.help=Expected SSH host key fingerprint (OpenSSH format, e.g. SHA256:...), verified on every connection — never accepted blindly
connector.batch-import.field.remoteDirectory.label=Remote directory
connector.batch-import.field.filenamePattern.label=Filename pattern
connector.batch-import.field.filenamePattern.help=Glob pattern, e.g. *.csv or export-*.xlsx
connector.batch-import.field.archiveDirectory.label=Archive directory
connector.batch-import.field.archiveDirectory.help=Processed files are moved here to avoid re-import on the next poll
connector.batch-import.field.cronExpression.label=Cron expression
connector.batch-import.field.processKey.label=Process key
connector.batch-import.field.dossierTypeCode.label=Dossier type
connector.batch-import.field.mapping.label=Row mapping
connector.batch-import.field.mapping.help=JSON object of column-name JSONPath mappings (fields, variables, processKeyPath, …)
connector.document-storage.label=Document storage (store/retrieve/exists/delete)
connector.flowable-callback.label=Flowable message callback (async correlation)
connector.flowable-callback.field.webhookAuthType.label=Webhook auth
connector.flowable-callback.field.webhookAuthType.help=IP_ALLOWLIST is not supported in V1. HMAC_SHA256 requires an X-Webhook-Timestamp header (Unix epoch seconds) and covers timestamp + "." + Idempotency-Key + "." + body (X-Signature-256), checked against a 5-minute freshness window
connector.flowable-callback.field.webhookSecret.label=Webhook secret
connector.flowable-callback.field.webhookSecret.help=HMAC or shared token secret -- at least 20 characters
connector.flowable-callback.field.messageName.label=BPMN message name
connector.flowable-callback.field.messageName.help=Must match the messageRef of the intermediateCatchEvent/receiveTask in the BPMN process
connector.flowable-callback.field.correlationVariableName.label=Correlation process variable
connector.flowable-callback.field.correlationVariableName.help=Name of the process variable set by the outbound serviceTask, matched against the callback payload. Must be set as a String process variable -- Flowable variable equality is type-sensitive (a String "123" never matches an Integer 123)
connector.flowable-callback.field.correlationValuePath.label=Correlation value JSONPath
connector.flowable-callback.field.correlationValuePath.help=JSONPath into the callback payload yielding the correlation value, e.g. $.orderId. Authentication is per connector instance, not per correlation value: use a high-entropy, non-sequential identifier (e.g. a UUID), never a guessable one (sequential dossier number), or any caller holding this instance's secret could correlate to an unrelated waiting process by guessing it
connector.flowable-callback.field.mapping.label=Payload mapping
connector.flowable-callback.field.mapping.help=JSON object of JSONPath mappings for callback variables.
connector.flowable-signal.label=Flowable signal
connector.flowable-signal.field.signalName.label=Signal name
connector.flowable-signal.field.signalName.help=Flowable global signal name
connector.flowable-signal.field.processKey.label=Process key
connector.flowable-signal.field.processKey.help=Default process key for TRIGGER path
connector.flowable-signal.field.dossierTypeCode.label=Dossier type
connector.flowable-signal.field.dossierTypeCode.help=Default dossier type for TRIGGER create
connector.flowable-signal.field.mapping.label=Payload mapping
connector.flowable-signal.field.mapping.help=JSON object of JSONPath mappings (fields, variables, …).
connector.graph-mail-inbound.label=Inbound email (Microsoft Graph, polling)
connector.graph-mail-inbound.field.mailbox.label=Mailbox
connector.graph-mail-inbound.field.mailbox.help=User principal name (shared mailbox included) or object id, e.g. dossiers@example.com. The application needs the Mail.ReadWrite application permission; restrict it to this mailbox with an application access policy.
connector.graph-mail-inbound.field.graphBaseUrl.label=Graph endpoint
connector.graph-mail-inbound.field.graphBaseUrl.help=Only Microsoft Graph hosts are accepted (graph.microsoft.com, graph.microsoft.us, dod-graph.microsoft.us, microsoftgraph.chinacloudapi.cn), https, e.g. https://graph.microsoft.com/v1.0.
connector.graph-mail-inbound.field.folder.label=Folder to read
connector.graph-mail-inbound.field.folder.help=Inbox, or the display name of a top-level folder (it must exist).
connector.graph-mail-inbound.field.processedFolder.label=Processed folder
connector.graph-mail-inbound.field.processedFolder.help=Taken-in messages are moved here (top-level folder, created if missing), never deleted.
connector.graph-mail-inbound.field.rejectedFolder.label=Rejected folder
connector.graph-mail-inbound.field.rejectedFolder.help=Automatic replies, lists and invalid messages are moved here (top-level folder, created if missing).
connector.graph-mail-inbound.field.pollSeconds.label=Polling interval (seconds)
connector.graph-mail-inbound.field.maxAttachments.label=Attachments kept per message
connector.graph-mail-inbound.field.maxAttachments.help=Further attachments are skipped (and counted in the process variable inboundAttachmentsSkipped).
connector.graph-mail-inbound.field.requireAuthenticatedSender.label=Require an authenticated sender to join an existing dossier
connector.graph-mail-inbound.field.requireAuthenticatedSender.help=true (default): a reference in the subject only adds the message to that dossier when the FIRST Authentication-Results header, written by YOUR receiving server (trustedAuthservId), attests the sender: dmarc=pass, or dkim=pass / spf=pass aligned with the From domain. Otherwise a new dossier is created (the sender address alone can be forged). Set false only if you accept that anyone who guesses a reference can feed that dossier.
connector.graph-mail-inbound.field.trustedAuthservId.label=Authentication-Results server id
connector.graph-mail-inbound.field.trustedAuthservId.help=The authserv-id your receiving server writes first in Authentication-Results (e.g. mx.example.com, or 'spf.protection.outlook.com' style identifier shown in a received message's headers). Required to join existing dossiers while requireAuthenticatedSender is true.
connector.graph-mail-inbound.field.referencePattern.label=Dossier reference pattern
connector.graph-mail-inbound.field.referencePattern.help=Regular expression with ONE capture group, applied to the subject, e.g. \\[(DOS-[0-9-]+)\\]. A match adds the message to that dossier; otherwise (or when the dossier does not exist) a new one is created.
connector.graph-mail-inbound.field.processKey.label=Process key
connector.graph-mail-inbound.field.dossierTypeCode.label=Dossier type
connector.graph-mail-inbound.field.mapping.label=Message mapping
connector.graph-mail-inbound.field.mapping.help=JSON object: {"fields": {"objet": "$.subject", "texte": "$.body", "expediteur": "$.from"}, "variables": {...}}. Available: messageId, from, fromName, subject, body, sentAt, attachmentCount, inReplyTo, references, conversationId.
connector.graph-mail-inbound.field.oauthTokenUrl.label=OAuth2 token URL
connector.graph-mail-inbound.field.oauthTokenUrl.help=https token endpoint, e.g. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Used only when the authentication mode is OAUTH2_CLIENT_CREDENTIALS.
connector.graph-mail-inbound.field.oauthClientId.label=OAuth2 client id
connector.graph-mail-inbound.field.oauthClientId.help=Application (client) id.
connector.graph-mail-inbound.field.oauthClientAuthMethod.label=OAuth2 client authentication
connector.graph-mail-inbound.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC use oauthClientSecret; PRIVATE_KEY_JWT uses oauthPrivateKey and oauthCertThumbprint.
connector.graph-mail-inbound.field.oauthClientSecret.label=OAuth2 client secret
connector.graph-mail-inbound.field.oauthClientSecret.help=Encrypted at rest.
connector.graph-mail-inbound.field.oauthPrivateKey.label=OAuth2 certificate private key
connector.graph-mail-inbound.field.oauthPrivateKey.help=PEM PKCS#8 RSA private key. Encrypted at rest. Required for PRIVATE_KEY_JWT.
connector.graph-mail-inbound.field.oauthCertThumbprint.label=OAuth2 certificate thumbprint
connector.graph-mail-inbound.field.oauthCertThumbprint.help=Hexadecimal SHA-1 (40) or SHA-256 (64) thumbprint. Required for PRIVATE_KEY_JWT.
connector.graph-mail-inbound.field.oauthScope.label=OAuth2 scope
connector.graph-mail-inbound.field.oauthScope.help=e.g. https://outlook.office365.com/.default (mailbox) or https://servicebus.azure.net/.default (Service Bus).
connector.http-rest.label=HTTP REST (webhook trigger + outbound call)
connector.http-rest.field.webhookEnabled.label=Inbound webhook enabled
connector.http-rest.field.webhookEnabled.help=Uncheck for a SERVICE-only instance (outbound calls only): the webhook fields below are then not required and the inbound webhook of this instance answers 404.
connector.http-rest.field.baseUrl.label=Base URL (SERVICE calls)
connector.http-rest.field.baseUrl.help=https base URL of the called API, e.g. https://hr.example.com/api/v2. When set, a call gives a relative path (with encoded pathParams and query) and an absolute url is refused: the authentication header never leaves this host.
connector.http-rest.field.webhookAuthType.label=Webhook auth
connector.http-rest.field.webhookAuthType.help=IP_ALLOWLIST is not supported in V1. HMAC_SHA256 requires an X-Webhook-Timestamp header (Unix epoch seconds) and covers timestamp + "." + Idempotency-Key + "." + body (X-Signature-256), checked against a 5-minute freshness window
connector.http-rest.field.webhookSecret.label=Webhook secret
connector.http-rest.field.webhookSecret.help=HMAC or shared token secret -- at least 20 characters. Required when the inbound webhook is enabled.
connector.http-rest.field.processKey.label=Process key
connector.http-rest.field.processKey.help=Required when the inbound webhook is enabled.
connector.http-rest.field.dossierTypeCode.label=Dossier type
connector.http-rest.field.dossierTypeCode.help=Required when the inbound webhook is enabled.
connector.http-rest.field.authHeaderValue.label=Authorization header value
connector.http-rest.field.authHeaderValue.help=Sent verbatim as the Authorization header on SERVICE calls, e.g. 'Bearer xxx' or 'Basic yyy'. Leave empty for no auth header. Ignored (never sent) when authMode is OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.authMode.label=Outbound authentication
connector.http-rest.field.authMode.help=SERVICE calls only. STATIC_HEADER sends authHeaderValue as is (default). OAUTH2_CLIENT_CREDENTIALS obtains, caches and renews a Bearer token (e.g. Microsoft Entra ID for D365 F&O, Dataverse, Graph).
connector.http-rest.field.oauthTokenUrl.label=OAuth2 token URL
connector.http-rest.field.oauthTokenUrl.help=https token endpoint, e.g. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Used only when authMode is OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.oauthClientId.label=OAuth2 client id
connector.http-rest.field.oauthClientId.help=Application (client) id. Used only with OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.oauthClientAuthMethod.label=OAuth2 client authentication
connector.http-rest.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC use oauthClientSecret; PRIVATE_KEY_JWT (certificate) uses oauthPrivateKey and oauthCertThumbprint.
connector.http-rest.field.oauthClientSecret.label=OAuth2 client secret
connector.http-rest.field.oauthClientSecret.help=Encrypted at rest. Required for CLIENT_SECRET_POST and CLIENT_SECRET_BASIC.
connector.http-rest.field.oauthPrivateKey.label=OAuth2 certificate private key
connector.http-rest.field.oauthPrivateKey.help=PEM PKCS#8 RSA private key (BEGIN PRIVATE KEY). Encrypted at rest. Required for PRIVATE_KEY_JWT.
connector.http-rest.field.oauthCertThumbprint.label=OAuth2 certificate thumbprint
connector.http-rest.field.oauthCertThumbprint.help=Hexadecimal SHA-1 (40 chars, as shown by the Entra portal) or SHA-256 (64 chars) thumbprint of the uploaded certificate. Required for PRIVATE_KEY_JWT.
connector.http-rest.field.oauthAllowedHosts.label=OAuth2 allowed API hosts
connector.http-rest.field.oauthAllowedHosts.help=Comma-separated host names that may receive the Bearer token, e.g. 'myorg.operations.dynamics.com, *.crm4.dynamics.com'. A call to any other host is refused before a token is requested. Required with OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.oauthScope.label=OAuth2 scope
connector.http-rest.field.oauthScope.help=e.g. https://<org>.operations.dynamics.com/.default. Optional.
connector.http-rest.field.mapping.label=Payload mapping
connector.http-rest.field.mapping.help=JSON object of JSONPath mappings (itemsPath, processKeyPath, …).
connector.imap-inbound.label=Inbound email (IMAP, polling)
connector.imap-inbound.field.host.label=IMAP host
connector.imap-inbound.field.host.help=e.g. imap.example.com or outlook.office365.com. Must resolve to a public address (localhost is accepted only when APP_ENVIRONMENT=local and the test or local profile is active).
connector.imap-inbound.field.port.label=IMAP port
connector.imap-inbound.field.security.label=Transport security
connector.imap-inbound.field.security.help=SSL = IMAPS (993). STARTTLS is required, never optional. The server certificate is always verified. PLAIN (no encryption) is only accepted for a localhost mailbox when APP_ENVIRONMENT=local and the test or local profile is active.
connector.imap-inbound.field.username.label=Mailbox user
connector.imap-inbound.field.authMode.label=Authentication
connector.imap-inbound.field.authMode.help=PASSWORD, or OAUTH2_CLIENT_CREDENTIALS (XOAUTH2 with an Entra ID application, scope https://outlook.office365.com/.default).
connector.imap-inbound.field.password.label=Mailbox password
connector.imap-inbound.field.password.help=Encrypted at rest. Required with PASSWORD.
connector.imap-inbound.field.folder.label=Folder to read
connector.imap-inbound.field.processedFolder.label=Processed folder
connector.imap-inbound.field.processedFolder.help=Taken-in messages are moved here (created if missing), never deleted.
connector.imap-inbound.field.rejectedFolder.label=Rejected folder
connector.imap-inbound.field.rejectedFolder.help=Automatic replies, lists, oversized or invalid messages are moved here.
connector.imap-inbound.field.pollSeconds.label=Polling interval (seconds)
connector.imap-inbound.field.maxAttachments.label=Attachments kept per message
connector.imap-inbound.field.maxAttachments.help=Further attachments are skipped (and counted in the process variable inboundAttachmentsSkipped).
connector.imap-inbound.field.requireAuthenticatedSender.label=Require an authenticated sender to join an existing dossier
connector.imap-inbound.field.requireAuthenticatedSender.help=true (default): a reference in the subject only adds the message to that dossier when the FIRST Authentication-Results header, written by YOUR receiving server (trustedAuthservId), attests the sender: dmarc=pass, or dkim=pass / spf=pass aligned with the From domain. Otherwise a new dossier is created (the sender address alone can be forged). Set false only if you accept that anyone who guesses a reference can feed that dossier.
connector.imap-inbound.field.trustedAuthservId.label=Authentication-Results server id
connector.imap-inbound.field.trustedAuthservId.help=The authserv-id your receiving server writes first in Authentication-Results (e.g. mx.example.com, or 'spf.protection.outlook.com' style identifier shown in a received message's headers). Required to join existing dossiers while requireAuthenticatedSender is true.
connector.imap-inbound.field.referencePattern.label=Dossier reference pattern
connector.imap-inbound.field.referencePattern.help=Regular expression with ONE capture group, applied to the subject, e.g. \\[(DOS-[0-9-]+)\\]. A match adds the message to that dossier; otherwise (or when the dossier does not exist) a new one is created.
connector.imap-inbound.field.processKey.label=Process key
connector.imap-inbound.field.dossierTypeCode.label=Dossier type
connector.imap-inbound.field.mapping.label=Message mapping
connector.imap-inbound.field.mapping.help=JSON object: {"fields": {"objet": "$.subject", "texte": "$.body", "expediteur": "$.from"}, "variables": {...}}. Available: messageId, from, fromName, subject, body, sentAt, attachmentCount, inReplyTo, references, conversationId.
connector.imap-inbound.field.oauthTokenUrl.label=OAuth2 token URL
connector.imap-inbound.field.oauthTokenUrl.help=https token endpoint, e.g. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Used only when the authentication mode is OAUTH2_CLIENT_CREDENTIALS.
connector.imap-inbound.field.oauthClientId.label=OAuth2 client id
connector.imap-inbound.field.oauthClientId.help=Application (client) id.
connector.imap-inbound.field.oauthClientAuthMethod.label=OAuth2 client authentication
connector.imap-inbound.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC use oauthClientSecret; PRIVATE_KEY_JWT uses oauthPrivateKey and oauthCertThumbprint.
connector.imap-inbound.field.oauthClientSecret.label=OAuth2 client secret
connector.imap-inbound.field.oauthClientSecret.help=Encrypted at rest.
connector.imap-inbound.field.oauthPrivateKey.label=OAuth2 certificate private key
connector.imap-inbound.field.oauthPrivateKey.help=PEM PKCS#8 RSA private key. Encrypted at rest. Required for PRIVATE_KEY_JWT.
connector.imap-inbound.field.oauthCertThumbprint.label=OAuth2 certificate thumbprint
connector.imap-inbound.field.oauthCertThumbprint.help=Hexadecimal SHA-1 (40) or SHA-256 (64) thumbprint. Required for PRIVATE_KEY_JWT.
connector.imap-inbound.field.oauthScope.label=OAuth2 scope
connector.imap-inbound.field.oauthScope.help=e.g. https://outlook.office365.com/.default (mailbox) or https://servicebus.azure.net/.default (Service Bus).
