connector.imap-inbound.field.trustedAuthservId.help=L'authserv-id que votre serveur de réception écrit en premier dans Authentication-Results (ex. mx.example.com, ou un identifiant du type 'spf.protection.outlook.com' visible dans les en-têtes d'un message reçu). Requis pour rejoindre des dossiers existants tant que requireAuthenticatedSender est true.
