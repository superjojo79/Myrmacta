connector.azure-service-bus.label=Azure Service Bus (file ou abonnement, interrogation)
connector.azure-service-bus.field.namespaceHost.label=Hôte du namespace
connector.azure-service-bus.field.namespaceHost.help=ex. mybus.servicebus.windows.net (domaines Service Bus uniquement).
connector.azure-service-bus.field.entityPath.label=File ou abonnement
connector.azure-service-bus.field.entityPath.help=Nom d'une file, ou <topic>/subscriptions/<subscription>.
connector.azure-service-bus.field.authMode.label=Authentification
connector.azure-service-bus.field.authMode.help=SAS = stratégie d'accès partagé avec le droit Listen. OAUTH2_CLIENT_CREDENTIALS = application Entra ID (rôle Azure Service Bus Data Receiver, portée https://servicebus.azure.net/.default).
connector.azure-service-bus.field.sasKeyName.label=Nom de la stratégie SAS
connector.azure-service-bus.field.sasKeyName.help=Requis avec SAS. Accordez-lui uniquement le droit Listen.
connector.azure-service-bus.field.sasKey.label=Clé de la stratégie SAS
connector.azure-service-bus.field.sasKey.help=Chiffrée au repos. Requis avec SAS.
connector.azure-service-bus.field.pollSeconds.label=Intervalle d'interrogation (secondes)
connector.azure-service-bus.field.processKey.label=Clé de processus
connector.azure-service-bus.field.dossierTypeCode.label=Type de dossier
connector.azure-service-bus.field.mapping.label=Mapping du message
connector.azure-service-bus.field.mapping.help=Objet JSON de mappings JSONPath sur le corps JSON du message : fields, variables, processKeyPath, dossierTypeCodePath, existingDossierReferencePath.
connector.azure-service-bus.field.oauthTokenUrl.label=URL du jeton OAuth2
connector.azure-service-bus.field.oauthTokenUrl.help=Point de terminaison https du jeton, ex. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Utilisé uniquement lorsque le mode d'authentification est OAUTH2_CLIENT_CREDENTIALS.
connector.azure-service-bus.field.oauthClientId.label=Identifiant client OAuth2
connector.azure-service-bus.field.oauthClientId.help=Identifiant d'application (client).
connector.azure-service-bus.field.oauthClientAuthMethod.label=Authentification client OAuth2
connector.azure-service-bus.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC utilisent oauthClientSecret ; PRIVATE_KEY_JWT utilise oauthPrivateKey et oauthCertThumbprint.
connector.azure-service-bus.field.oauthClientSecret.label=Secret client OAuth2
connector.azure-service-bus.field.oauthClientSecret.help=Chiffré au repos.
connector.azure-service-bus.field.oauthPrivateKey.label=Clé privée du certificat OAuth2
connector.azure-service-bus.field.oauthPrivateKey.help=Clé privée RSA PKCS#8 au format PEM. Chiffrée au repos. Requis pour PRIVATE_KEY_JWT.
connector.azure-service-bus.field.oauthCertThumbprint.label=Empreinte du certificat OAuth2
connector.azure-service-bus.field.oauthCertThumbprint.help=Empreinte hexadécimale SHA-1 (40) ou SHA-256 (64). Requis pour PRIVATE_KEY_JWT.
connector.azure-service-bus.field.oauthScope.label=Portée OAuth2
connector.azure-service-bus.field.oauthScope.help=ex. https://outlook.office365.com/.default (boîte) ou https://servicebus.azure.net/.default (Service Bus).
connector.batch-import.label=Import par lot (SFTP, CSV/Excel, déclenchement cron)
connector.batch-import.field.sftpHost.label=Hôte SFTP
connector.batch-import.field.sftpPort.label=Port SFTP
