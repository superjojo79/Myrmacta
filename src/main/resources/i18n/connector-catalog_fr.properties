connector.imap-inbound.field.requireAuthenticatedSender.help=true (défaut) : une référence dans l'objet n'ajoute le message à ce dossier que si le PREMIER en-tête Authentication-Results, écrit par VOTRE serveur de réception (trustedAuthservId), atteste l'expéditeur : dmarc=pass, ou dkim=pass / spf=pass aligné avec le domaine From. Sinon un nouveau dossier est créé (l'adresse de l'expéditeur seule peut être usurpée). Mettez false seulement si vous acceptez que quiconque devine une référence puisse alimenter ce dossier.
