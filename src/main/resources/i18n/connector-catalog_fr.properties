connector.imap-inbound.field.referencePattern.help=Expression régulière avec UN groupe de capture, appliquée à l'objet, ex. \\[(DOS-[0-9-]+)\\]. Une correspondance ajoute le message à ce dossier ; sinon (ou si le dossier n'existe pas) un nouveau est créé.
