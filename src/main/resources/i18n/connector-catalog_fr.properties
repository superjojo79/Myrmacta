connector.batch-import.field.sftpPrivateKey.help=Clé privée SSH encodée en PEM, requise lorsque sftpAuthType=PRIVATE_KEY
connector.batch-import.field.sftpHostKeyFingerprint.label=Empreinte de clé hôte SFTP
connector.batch-import.field.sftpHostKeyFingerprint.help=Empreinte de clé hôte SSH attendue (format OpenSSH, ex. SHA256:...), vérifiée à chaque connexion — jamais acceptée à l'aveugle
connector.batch-import.field.remoteDirectory.label=Répertoire distant
