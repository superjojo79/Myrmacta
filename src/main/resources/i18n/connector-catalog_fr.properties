connector.batch-import.field.filenamePattern.help=Motif glob, ex. *.csv ou export-*.xlsx
connector.batch-import.field.archiveDirectory.label=Répertoire d'archive
connector.batch-import.field.archiveDirectory.help=Les fichiers traités sont déplacés ici pour éviter une réimportation au prochain cycle
connector.batch-import.field.cronExpression.label=Expression cron
connector.batch-import.field.processKey.label=Clé de processus
connector.batch-import.field.dossierTypeCode.label=Type de dossier
connector.batch-import.field.mapping.label=Mapping des lignes
connector.batch-import.field.mapping.help=Objet JSON de mappings JSONPath sur les noms de colonnes (fields, variables, processKeyPath, …)
connector.document-storage.label=Stockage de documents (store/retrieve/exists/delete)
connector.flowable-callback.label=Rappel message Flowable (corrélation asynchrone)
connector.flowable-callback.field.webhookAuthType.label=Authentification du webhook
connector.flowable-callback.field.webhookAuthType.help=IP_ALLOWLIST n'est pas pris en charge en V1. HMAC_SHA256 exige un en-tête X-Webhook-Timestamp (secondes Unix epoch) et couvre timestamp + "." + Idempotency-Key + "." + corps (X-Signature-256), vérifié dans une fenêtre de fraîcheur de 5 minutes
connector.flowable-callback.field.webhookSecret.label=Secret du webhook
connector.flowable-callback.field.webhookSecret.help=Secret HMAC ou jeton partagé — au moins 20 caractères
connector.flowable-callback.field.messageName.label=Nom du message BPMN
connector.flowable-callback.field.messageName.help=Doit correspondre au messageRef de l'intermediateCatchEvent/receiveTask dans le processus BPMN
connector.flowable-callback.field.correlationVariableName.label=Variable de processus de corrélation
connector.flowable-callback.field.correlationVariableName.help=Nom de la variable de processus posée par le serviceTask sortant, confrontée au payload du rappel. Doit être une variable de processus String — l'égalité Flowable est sensible au type (un String "123" ne correspond jamais à un Integer 123)
connector.flowable-callback.field.correlationValuePath.label=JSONPath de la valeur de corrélation
connector.flowable-callback.field.correlationValuePath.help=JSONPath dans le payload du rappel donnant la valeur de corrélation, ex. $.orderId. L'authentification est par instance de connecteur, pas par valeur de corrélation : utilisez un identifiant à haute entropie et non séquentiel (ex. un UUID), jamais un identifiant devinable (numéro de dossier séquentiel), sinon tout appelant détenant le secret de cette instance pourrait corréler un processus en attente sans rapport en le devinant
connector.flowable-callback.field.mapping.label=Mapping du payload
connector.flowable-callback.field.mapping.help=Objet JSON de mappings JSONPath pour les variables du rappel.
connector.flowable-signal.label=Signal Flowable
connector.flowable-signal.field.signalName.label=Nom du signal
connector.flowable-signal.field.signalName.help=Nom du signal global Flowable
connector.flowable-signal.field.processKey.label=Clé de processus
connector.flowable-signal.field.processKey.help=Clé de processus par défaut pour le chemin TRIGGER
connector.flowable-signal.field.dossierTypeCode.label=Type de dossier
connector.flowable-signal.field.dossierTypeCode.help=Type de dossier par défaut pour la création TRIGGER
connector.flowable-signal.field.mapping.label=Mapping du payload
connector.flowable-signal.field.mapping.help=Objet JSON de mappings JSONPath (fields, variables, …).
connector.graph-mail-inbound.label=E-mail entrant (Microsoft Graph, interrogation)
connector.graph-mail-inbound.field.mailbox.label=Boîte aux lettres
connector.graph-mail-inbound.field.mailbox.help=Nom principal d'utilisateur (boîte partagée comprise) ou object id, ex. dossiers@example.com. L'application a besoin de la permission d'application Mail.ReadWrite ; restreignez-la à cette boîte avec une stratégie d'accès d'application.
connector.graph-mail-inbound.field.graphBaseUrl.label=Point de terminaison Graph
connector.graph-mail-inbound.field.graphBaseUrl.help=Seuls les hôtes Microsoft Graph sont acceptés (graph.microsoft.com, graph.microsoft.us, dod-graph.microsoft.us, microsoftgraph.chinacloudapi.cn), https, ex. https://graph.microsoft.com/v1.0.
connector.graph-mail-inbound.field.folder.label=Dossier à lire
connector.graph-mail-inbound.field.folder.help=Inbox, ou le nom d'affichage d'un dossier de premier niveau (il doit exister).
connector.graph-mail-inbound.field.processedFolder.label=Dossier des messages traités
connector.graph-mail-inbound.field.processedFolder.help=Les messages pris en charge sont déplacés ici (dossier de premier niveau, créé s'il manque), jamais supprimés.
connector.graph-mail-inbound.field.rejectedFolder.label=Dossier des messages refusés
connector.graph-mail-inbound.field.rejectedFolder.help=Les réponses automatiques, listes et messages invalides sont déplacés ici (dossier de premier niveau, créé s'il manque).
connector.graph-mail-inbound.field.pollSeconds.label=Intervalle d'interrogation (secondes)
connector.graph-mail-inbound.field.maxAttachments.label=Pièces jointes conservées par message
connector.graph-mail-inbound.field.maxAttachments.help=Les pièces jointes suivantes sont ignorées (et comptées dans la variable de processus inboundAttachmentsSkipped).
connector.graph-mail-inbound.field.requireAuthenticatedSender.label=Exiger un expéditeur authentifié pour rejoindre un dossier existant
connector.graph-mail-inbound.field.requireAuthenticatedSender.help=true (défaut) : une référence dans l'objet n'ajoute le message à ce dossier que si le PREMIER en-tête Authentication-Results, écrit par VOTRE serveur de réception (trustedAuthservId), atteste l'expéditeur : dmarc=pass, ou dkim=pass / spf=pass aligné avec le domaine From. Sinon un nouveau dossier est créé (l'adresse de l'expéditeur seule peut être usurpée). Mettez false seulement si vous acceptez que quiconque devine une référence puisse alimenter ce dossier.
connector.graph-mail-inbound.field.trustedAuthservId.label=Identifiant du serveur Authentication-Results
connector.graph-mail-inbound.field.trustedAuthservId.help=L'authserv-id que votre serveur de réception écrit en premier dans Authentication-Results (ex. mx.example.com, ou un identifiant du type 'spf.protection.outlook.com' visible dans les en-têtes d'un message reçu). Requis pour rejoindre des dossiers existants tant que requireAuthenticatedSender est true.
connector.graph-mail-inbound.field.referencePattern.label=Motif de référence de dossier
connector.graph-mail-inbound.field.referencePattern.help=Expression régulière avec UN groupe de capture, appliquée à l'objet, ex. \\[(DOS-[0-9-]+)\\]. Une correspondance ajoute le message à ce dossier ; sinon (ou si le dossier n'existe pas) un nouveau est créé.
connector.graph-mail-inbound.field.processKey.label=Clé de processus
connector.graph-mail-inbound.field.dossierTypeCode.label=Type de dossier
connector.graph-mail-inbound.field.mapping.label=Mapping du message
connector.graph-mail-inbound.field.mapping.help=Objet JSON : {"fields": {"objet": "$.subject", "texte": "$.body", "expediteur": "$.from"}, "variables": {...}}. Disponibles : messageId, from, fromName, subject, body, sentAt, attachmentCount, inReplyTo, references, conversationId.
connector.graph-mail-inbound.field.oauthTokenUrl.label=URL du jeton OAuth2
connector.graph-mail-inbound.field.oauthTokenUrl.help=Point de terminaison https du jeton, ex. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Utilisé uniquement lorsque le mode d'authentification est OAUTH2_CLIENT_CREDENTIALS.
connector.graph-mail-inbound.field.oauthClientId.label=Identifiant client OAuth2
connector.graph-mail-inbound.field.oauthClientId.help=Identifiant d'application (client).
connector.graph-mail-inbound.field.oauthClientAuthMethod.label=Authentification client OAuth2
connector.graph-mail-inbound.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC utilisent oauthClientSecret ; PRIVATE_KEY_JWT utilise oauthPrivateKey et oauthCertThumbprint.
connector.graph-mail-inbound.field.oauthClientSecret.label=Secret client OAuth2
connector.graph-mail-inbound.field.oauthClientSecret.help=Chiffré au repos.
connector.graph-mail-inbound.field.oauthPrivateKey.label=Clé privée du certificat OAuth2
connector.graph-mail-inbound.field.oauthPrivateKey.help=Clé privée RSA PKCS#8 au format PEM. Chiffrée au repos. Requis pour PRIVATE_KEY_JWT.
connector.graph-mail-inbound.field.oauthCertThumbprint.label=Empreinte du certificat OAuth2
connector.graph-mail-inbound.field.oauthCertThumbprint.help=Empreinte hexadécimale SHA-1 (40) ou SHA-256 (64). Requis pour PRIVATE_KEY_JWT.
connector.graph-mail-inbound.field.oauthScope.label=Portée OAuth2
connector.graph-mail-inbound.field.oauthScope.help=ex. https://outlook.office365.com/.default (boîte) ou https://servicebus.azure.net/.default (Service Bus).
connector.http-rest.label=HTTP REST (déclenchement webhook + appel sortant)
connector.http-rest.field.webhookEnabled.label=Webhook entrant activé
connector.http-rest.field.webhookEnabled.help=Décochez pour une instance SERVICE uniquement (appels sortants seulement) : les champs webhook ci-dessous ne sont alors pas requis et le webhook entrant de cette instance répond 404.
connector.http-rest.field.baseUrl.label=URL de base (appels SERVICE)
connector.http-rest.field.baseUrl.help=URL de base https de l'API appelée, ex. https://hr.example.com/api/v2. Lorsqu'elle est définie, un appel donne un chemin relatif (avec pathParams et query encodés) et une url absolue est refusée : l'en-tête d'authentification ne quitte jamais cet hôte.
connector.http-rest.field.webhookAuthType.label=Authentification du webhook
connector.http-rest.field.webhookAuthType.help=IP_ALLOWLIST n'est pas pris en charge en V1. HMAC_SHA256 exige un en-tête X-Webhook-Timestamp (secondes Unix epoch) et couvre timestamp + "." + Idempotency-Key + "." + corps (X-Signature-256), vérifié dans une fenêtre de fraîcheur de 5 minutes
connector.http-rest.field.webhookSecret.label=Secret du webhook
connector.http-rest.field.webhookSecret.help=Secret HMAC ou jeton partagé — au moins 20 caractères. Requis lorsque le webhook entrant est activé.
connector.http-rest.field.processKey.label=Clé de processus
connector.http-rest.field.processKey.help=Requis lorsque le webhook entrant est activé.
connector.http-rest.field.dossierTypeCode.label=Type de dossier
connector.http-rest.field.dossierTypeCode.help=Requis lorsque le webhook entrant est activé.
connector.http-rest.field.authHeaderValue.label=Valeur de l'en-tête Authorization
connector.http-rest.field.authHeaderValue.help=Envoyée telle quelle comme en-tête Authorization sur les appels SERVICE, ex. 'Bearer xxx' ou 'Basic yyy'. Laissez vide pour aucun en-tête d'auth. Ignorée (jamais envoyée) lorsque authMode est OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.authMode.label=Authentification sortante
connector.http-rest.field.authMode.help=Appels SERVICE uniquement. STATIC_HEADER envoie authHeaderValue tel quel (défaut). OAUTH2_CLIENT_CREDENTIALS obtient, met en cache et renouvelle un jeton Bearer (ex. Microsoft Entra ID pour D365 F&O, Dataverse, Graph).
connector.http-rest.field.oauthTokenUrl.label=URL du jeton OAuth2
connector.http-rest.field.oauthTokenUrl.help=Point de terminaison https du jeton, ex. https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token. Utilisé uniquement lorsque authMode est OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.oauthClientId.label=Identifiant client OAuth2
connector.http-rest.field.oauthClientId.help=Identifiant d'application (client). Utilisé uniquement avec OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.oauthClientAuthMethod.label=Authentification client OAuth2
connector.http-rest.field.oauthClientAuthMethod.help=CLIENT_SECRET_POST / CLIENT_SECRET_BASIC utilisent oauthClientSecret ; PRIVATE_KEY_JWT (certificat) utilise oauthPrivateKey et oauthCertThumbprint.
connector.http-rest.field.oauthClientSecret.label=Secret client OAuth2
connector.http-rest.field.oauthClientSecret.help=Chiffré au repos. Requis pour CLIENT_SECRET_POST et CLIENT_SECRET_BASIC.
connector.http-rest.field.oauthPrivateKey.label=Clé privée du certificat OAuth2
connector.http-rest.field.oauthPrivateKey.help=Clé privée RSA PKCS#8 au format PEM (BEGIN PRIVATE KEY). Chiffrée au repos. Requis pour PRIVATE_KEY_JWT.
connector.http-rest.field.oauthCertThumbprint.label=Empreinte du certificat OAuth2
connector.http-rest.field.oauthCertThumbprint.help=Empreinte hexadécimale SHA-1 (40 caractères, comme affichée par le portail Entra) ou SHA-256 (64 caractères) du certificat téléversé. Requis pour PRIVATE_KEY_JWT.
connector.http-rest.field.oauthAllowedHosts.label=Hôtes d'API autorisés OAuth2
connector.http-rest.field.oauthAllowedHosts.help=Noms d'hôtes séparés par des virgules pouvant recevoir le jeton Bearer, ex. 'myorg.operations.dynamics.com, *.crm4.dynamics.com'. Un appel vers tout autre hôte est refusé avant qu'un jeton ne soit demandé. Requis avec OAUTH2_CLIENT_CREDENTIALS.
connector.http-rest.field.oauthScope.label=Portée OAuth2
connector.http-rest.field.oauthScope.help=ex. https://<org>.operations.dynamics.com/.default. Optionnel.
connector.http-rest.field.mapping.label=Mapping du payload
connector.http-rest.field.mapping.help=Objet JSON de mappings JSONPath (itemsPath, processKeyPath, …).
connector.imap-inbound.label=E-mail entrant (IMAP, interrogation)
connector.imap-inbound.field.host.label=Hôte IMAP
connector.imap-inbound.field.host.help=ex. imap.example.com ou outlook.office365.com. Doit résoudre vers une adresse publique (localhost n'est accepté que lorsque APP_ENVIRONMENT=local and the test or local profile is active).
connector.imap-inbound.field.port.label=Port IMAP
connector.imap-inbound.field.security.label=Sécurité du transport
connector.imap-inbound.field.security.help=SSL = IMAPS (993). STARTTLS est obligatoire, jamais optionnel. Le certificat serveur est toujours vérifié. PLAIN (sans chiffrement) n'est accepté que pour une boîte localhost lorsque APP_ENVIRONMENT=local and the test or local profile is active.
connector.imap-inbound.field.username.label=Utilisateur de la boîte
connector.imap-inbound.field.authMode.label=Authentification
connector.imap-inbound.field.authMode.help=PASSWORD, ou OAUTH2_CLIENT_CREDENTIALS (XOAUTH2 avec une application Entra ID, portée https://outlook.office365.com/.default).
connector.imap-inbound.field.password.label=Mot de passe de la boîte
connector.imap-inbound.field.password.help=Chiffré au repos. Requis avec PASSWORD.
connector.imap-inbound.field.folder.label=Dossier à lire
