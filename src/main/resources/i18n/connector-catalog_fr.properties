connector.imap-inbound.field.processedFolder.help=Les messages pris en charge sont déplacés ici (créé s'il manque), jamais supprimés.
connector.imap-inbound.field.rejectedFolder.label=Dossier des messages refusés
connector.imap-inbound.field.rejectedFolder.help=Les réponses automatiques, listes, messages trop volumineux ou invalides sont déplacés ici.
