# TODO §121 (D-CAL-ICS, D-CAL-ICS-URL) — ical4j ne fait aucun appel réseau : ni mise à jour des fuseaux horaires par
# TZURL, ni cache distant. Les fuseaux viennent du JDK et des VTIMEZONE du fichier. La mise à jour est déjà coupée par
# défaut dans ical4j 4.4.0 ; la dire ici garde le comportement si le défaut change. Le test
# Ical4jIcsCalendarParserTest#readingNeverCallsTheNetwork* le vérifie contre un serveur local.
net.fortuna.ical4j.timezone.update.enabled=false
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
# Les fichiers exportés à la main ont souvent des fins de ligne LF ou des replis imparfaits.
ical4j.parsing.relaxed=true
ical4j.unfolding.relaxed=true
