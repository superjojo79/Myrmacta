# Resolve required OIDC placeholders without a real IdP (ClientRegistrationRepository stub in tests).
OIDC_ISSUER_URI=http://127.0.0.1:9/realms/test
OIDC_CLIENT_SECRET=test-secret
app.security.cookie.secure=false
spring.datasource.url=jdbc:h2:mem:flowforge_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS tenant_dev\\;SET SCHEMA tenant_dev
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.database-change-log-table=databasechangelog
spring.liquibase.database-change-log-lock-table=databasechangeloglock
flowable.database-type=postgres
app.connector.crypto.master-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.m2m.jwt-secret=0123456789abcdef0123456789abcdef
