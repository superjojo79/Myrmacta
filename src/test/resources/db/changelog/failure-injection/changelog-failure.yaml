# Changelog de test dédié à LiquibasePartialFailureIT (fiabilisation-tests-plateforme,
# D-LIQUIBASE-TEST) : le changeset 003 échoue délibérément (colonne NOT NULL omise), simulant un
# échec partiel de migration mono-schéma. Jamais référencé depuis db.changelog-master.yaml.
databaseChangeLog:
  - changeSet:
      id: 001-create-probe-table
      author: test
      changes:
        - createTable:
            tableName: failure_injection_probe
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
              - column:
                  name: label
                  type: varchar(50)
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-insert-first-row
      author: test
      changes:
        - insert:
            tableName: failure_injection_probe
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: label
                  value: "committed-before-failure"
  - changeSet:
      id: 003-fails-on-not-null
      author: test
      changes:
        - sql:
            sql: INSERT INTO failure_injection_probe (id) VALUES (2)
  - changeSet:
      id: 004-never-reached
      author: test
      changes:
        - insert:
            tableName: failure_injection_probe
            columns:
              - column:
                  name: id
                  valueNumeric: 3
              - column:
                  name: label
                  value: "should-not-run-until-003-is-fixed"
